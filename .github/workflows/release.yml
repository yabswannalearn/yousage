name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend and Rust tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri NSIS Setup Wizard & standalone executable
        run: npm run tauri build

      - name: Upload installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $exe = Get-Item "src-tauri/target/release/yousage.exe"
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag $setup.FullName $exe.FullName `
              --title "YouSage $tag" `
              --notes "### Downloads`n- **$($setup.Name)**: Windows Setup Wizard installer (Recommended)`n- **yousage.exe**: Standalone portable executable"
          } else {
            gh release upload $tag $setup.FullName $exe.FullName --clobber
          }
