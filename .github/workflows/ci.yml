name: Windows checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npx playwright install chromium
      - name: Exercise the desktop interface
        shell: pwsh
        run: |
          $vite = Start-Process node -ArgumentList 'node_modules/vite/bin/vite.js' -PassThru -WindowStyle Hidden
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest http://127.0.0.1:1420 -TimeoutSec 2 | Out-Null
                break
              } catch {
                if ($vite.HasExited -or $attempt -eq 29) { throw }
                Start-Sleep -Seconds 1
              }
            }
            foreach ($test in @('desktop-ui', 'docking-ui', 'history-privacy-ui', 'notch-sessions-ui')) {
              node "tests/$test.mjs"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            if (!$vite.HasExited) { Stop-Process -Id $vite.Id }
          }
