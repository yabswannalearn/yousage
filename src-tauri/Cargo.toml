[package]
name = "yousage"
version = "0.1.0"
description = "A small Codex usage companion for Windows"
edition = "2021"
rust-version = "1.85"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "time", "sync", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"

[profile.dev]
debug = 1
