[package]
name = "yousage"
version = "0.1.0"
description = "A small Codex, Antigravity, and Claude usage companion for Windows"
edition = "2021"
rust-version = "1.85"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "time", "sync", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
age = { version = "0.11", default-features = false }
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"

[profile.dev]
debug = 1

# Keep Codex's password KDF practical in development builds as well.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
